<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Вход — Mini-Shelter</title>
<style>
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
    background: #f4f5f7;
    color: #1f2328;
    font: 14px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  form {
    width: 100%;
    max-width: 320px;
    padding: 24px;
    background: #fff;
    border: 1px solid #e1e4e8;
    border-radius: 10px;
  }
  h1 { font-size: 18px; margin: 0 0 18px; font-weight: 600; }
  label { display: block; font-size: 12px; color: #6a737d; margin-bottom: 4px; }
  input {
    width: 100%;
    padding: 8px 10px;
    font: inherit;
    border: 1px solid #c4c9d0;
    border-radius: 6px;
  }
  input:focus { outline: 2px solid #b9cbff; border-color: #2f5bd3; }
  .error { color: #d0393a; font-size: 13px; min-height: 18px; margin: 6px 0 10px; }
  button[type=submit] {
    width: 100%;
    height: 36px;
    font: inherit;
    color: #fff;
    background: #2f5bd3;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  button[type=submit]:hover { background: #2a52be; }
  /* шрифт 16px — иначе iPhone увеличивает страницу при вводе пароля */
  @media (pointer: coarse) {
    input { font-size: 16px; padding: 10px 12px; }
    button[type=submit] { height: 42px; }
  }

  .pw { position: relative; }
  .pw input { padding-right: 40px; }
  .eye {
    position: absolute;
    top: 0;
    right: 0;
    width: 38px;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
    color: #6a737d;
    background: none;
    border: none;
    border-radius: 0 6px 6px 0;
    cursor: pointer;
  }
  .eye:hover { color: #1f2328; }
  .eye:focus-visible { outline: 2px solid #b9cbff; }
  .eye .off, .eye.shown .on { display: none; }
  .eye.shown .off { display: block; }
</style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Mini-Shelter</h1>
    <label for="password">Пароль</label>
    <div class="pw">
      <input type="password" id="password" name="password" required autofocus autocomplete="current-password">
      <button type="button" class="eye" id="eye" title="Показать пароль" aria-label="Показать пароль">
        <svg class="on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
      </button>
    </div>
    <div class="error"><!--error--></div>
    <button type="submit">Войти</button>
  </form>
<script>
  const eye = document.getElementById('eye');
  const input = document.getElementById('password');
  eye.addEventListener('click', () => {
    const show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    eye.classList.toggle('shown', show);
    eye.title = show ? 'Скрыть пароль' : 'Показать пароль';
    eye.setAttribute('aria-label', eye.title);
    input.focus();
  });
</script>
</body>
</html>
